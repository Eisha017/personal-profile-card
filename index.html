<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Card | Eisha Naeem</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="blob blob1"></div>

        <div class="blob blob2"></div>

        <div class="blob blob3"></div>

    </div>


    <!-- Main Container -->

    <main class="container">

        <section class="profile-card">

            <!-- Profile Image -->

            <div class="profile">

                <img src="images/myprof.jpeg"
                    alt="Eisha Naeem">

            </div>


            <!-- Name -->

            <h1>Eisha Naeem</h1>


            <!-- Profession -->

            <h2>Computer Engineer</h2>


            <!-- About -->

            <p class="about">

                Passionate about building modern, responsive web applications while
                continuously improving my front-end development skills and
                working towards a career in AI Engineering.

            </p>


            <!-- Skills -->

            <div class="skills">

                <span>HTML</span>

                <span>CSS</span>

                <span>JavaScript</span>

                <span>Git</span>

                <span>Responsive Design</span>

            </div>


            <!-- Contact Button -->

            <a href="mailto:eishaa030@gmail.com" class="contact-btn">

                <i class="fa-solid fa-paper-plane"></i>

                Contact Me

            </a>


            <!-- Divider -->

            <div class="divider"></div>


            <!-- Social Links -->

            <div class="socials">

                <a href="https://github.com/Eisha017"
                    target="_blank"
                    aria-label="GitHub">

                    <i class="fa-brands fa-github"></i>

                </a>

                <a href="https://www.linkedin.com/in/eishaa-naeem"
                    target="_blank"
                    aria-label="LinkedIn">

                    <i class="fa-brands fa-linkedin"></i>

                </a>

                <a href="mailto:eishaa030@gmail.com"
                    aria-label="Email">

                    <i class="fa-solid fa-envelope"></i>

                </a>

            </div>

        </section>

    </main>

</body>

</html>
